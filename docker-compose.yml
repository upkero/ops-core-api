services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ops_core}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # No default on purpose: a password that ships in the repo is not a password. Set it in .env.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy .env.example)}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ops_core}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      # Exposed for psql / local tooling. Remove if you do not need it.
      - "127.0.0.1:5432:5432"

  ops-core-api:
    restart: unless-stopped
    build:
      context: .
      args:
        # Set LOCAL_MODELS=true in .env to bake in sentence-transformers (EMBEDDING_PROVIDER=local).
        LOCAL_MODELS: ${LOCAL_MODELS:-false}
    env_file: .env
    environment:
      # Overrides the host in .env: inside the compose network the database is
      # reachable as "db", not localhost.
      DB_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy .env.example)}@db:5432/${POSTGRES_DB:-ops_core}
    depends_on:
      db:
        # Waits for the healthcheck, not just for the container to exist, so
        # migrations never race a database that is still starting up.
        condition: service_healthy
    command: ["./scripts/start.sh"]
    volumes:
      - hf_cache:/models  # downloaded model weights, kept across rebuilds
    ports:
      # Loopback only: /docs and /health need no key, and on Linux a port Docker
      # publishes on 0.0.0.0 bypasses ufw. The sibling services' compose files
      # reach it through host.docker.internal, which on Docker Desktop includes
      # loopback ports but on plain Linux does not: there, run them all on one
      # network (service name ops-core-api) instead of publishing this port wider.
      - "127.0.0.1:8000:8000"

volumes:
  db_data:
  hf_cache:
